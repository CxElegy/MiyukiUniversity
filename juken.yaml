    why: 環境コンサル・自治体・インフラ方面。2027年度は新設が多く、初年度は倍率が読みにくい（チャンスにもなる）。
    kyotsu: 大学による
    niji: 大学による
    examples:
      - {name: 長崎大 環境科学部（理系B）, schedule: 前期, border: "共テ54%・偏差値45.0", level: 安全寄り, url: "https://search.keinet.ne.jp/1435/general/border_rate"}
      - {name: 熊本県立大 半導体学部【2027新設】, schedule: 前期・後期, note: "定員60。2026年9月に設置認可。半導体産業が集まる熊本で学べる", url: "https://manabi.benesse.ne.jp/daigaku/school/2325/nyushi/handoutai/"}
      - {name: 福山市立大 情報工学部【2027新設】, schedule: 前期ほか, note: "定員80（前期25名予定）。デジタルものづくり／サイバーセキュリティ", url: "https://scan.netsecurity.ne.jp/article/2026/09/14/56212.html"}
      - {name: 兵庫県立大 環境人間学部【学科新設】, schedule: 前期, border: "共テ69%・偏差値52.5", level: チャレンジ, note: "建築地域デザイン学科・グリーンサイエンス学科"}

recommend_tips:
  - 美幸は★の2つ（自然・動物×英国、読む・書く×自然・地域）から前期の本命を選ぶのがおすすめ。前期で国語・英語型を1つ、安全寄りを1つ、後期は面接・小論文型で。
  - 前期・中期・後期で1校ずつ。前期は本命（実力相応）。
  - 中期は公立の共テ高得点型（諏訪東京理科・兵庫県立 理）か、チャレンジ（大阪公立 工）。
  - 後期は前期よりボーダーが +7〜10% 高いので、共テのみ・面接のみの学科（新潟大 工、群馬大 理工、富山県立大）で拾う。
  - 1/18 の自己採点で最終決定。ボーダーとの差が −3% 以内なら出願可、+5% 以上なら一段上げる。
  - 二次の型を「英＋数」「数＋物」「数のみ」のどれかに寄せると、対策が分散しない。
  - 私大は国公立前期の発表（3/6〜）より先に入学手続締切が来る。東洋大（基礎学力テスト型・共テ利用）などで押さえを確保。学校からの推薦は専願が多いので、国公立を受けるなら使えるか先生に確認。

# 逆算プラン：本番から逆算した「この期間にやること」。from〜to が今日を含む期間がページ上部の「いまやること」になる
plan:
  - from: 2026-10-12
    to: 2026-10-31
    title: 方針を決める
    color: "#C8102E"
    goal: 国公立の受け方（共テ＋二次の科目の型）と、私大の押さえの方針を決める
    todo:
      - 共テの出願内容を確認・訂正（10/16 17:00まで）
      - 学校からの推薦（専願）を使うか先生と相談（専願なので、使うと国公立は受けられない可能性）
      - 東洋大 基礎学力テスト型（併願可）に出すか決める（出願 10/29〜11/4）
      - 10/18 河合塾の共テ模試 → 科目ごとの得点率を記録
      - 「おすすめ学部」から前期の候補を3つに絞り、二次の型（英＋数／数＋物／数のみ）を決める
      - 情報Ⅰの対策を始める（週2回、教科書＋予想問題）
    decide:
      - by: 2026-10-31
        q: 学校からの推薦（専願）を使う？
        look: [10/18 模試の得点率と、前期候補のボーダーとの差, 推薦先に本当に行きたいか（専願なので、受かったら国公立は受けられない）]
        rule: ボーダーまで10%以上あって、推薦先が行きたい大学なら先生と相談。そうでなければ一般選抜一本でOK
      - by: 2026-11-04
        q: 東洋大 基礎学力テスト型に出す？
        look: [科目は英語＋国語or数学（得意の英国で受けられる）, 試験 11/29 は共テの48日前（準備に何日使うか）, 12/18 の一次手続で入学金がいるか（募集要項で確認）]
        rule: 一次手続でお金がいらない（または払ってもいいと家族で決めた）なら出す。年内に押さえが1つあると、1月が楽になる
      - by: 2026-10-31
        q: 前期の候補3つと、二次の型は？
        look: [10/18 模試の科目ごとの得点率, 「おすすめ学部」の二次科目（★の2つ）, 好きな分野（自然・動物・地域）]
        rule: ボーダーとの差が −5% 以内を「実力相応」、−10% 以内を「チャレンジ」。二次科目が同じ型の大学でそろえる
  - from: 2026-11-01
    to: 2026-11-30
    title: 二次の型を固める・共テの穴を埋める
    color: "#7A3E9D"
    goal: 共テ模試で、前期候補のボーダー −5% 以内に入る
    todo:
      - 11/1 駿台ベネッセ・11/15 全統プレの結果から、弱点科目を2つ決めて集中
      - 前期候補の過去問を1年分解いて、二次の傾向をつかむ
      - 11/29 東洋大 基礎学力テスト（出願した場合）
      - 勉強の配分は 共テ6：二次4
      - 英検を使うなら第3回申込（〜12/14）か S-CBT を検討
      - インフルエンザの予防接種
    decide:
      - by: 2026-11-20
        q: どの科目を集中してやる？（2つ）
        look: [11/1・11/15 の模試の科目ごとの得点率, 前期候補の共テの配点（傾斜配点で大きい科目）]
        rule: 「配点が大きい」×「得点率が低い」科目から。満点に近い科目はキープだけ
      - by: 2026-11-30
        q: 英検を使う？
        look: [前期候補・私大に英検で加点・みなし満点があるか, 第3回は一次 1/24・結果 2/15 で、出願に間に合わないことが多い]
        rule: 候補に英検を使う大学がなければ、今季は使わない
        source: https://www.eiken.or.jp/eiken/schedule/examinee/03/
  - from: 2026-12-01
    to: 2026-12-25
    title: 共テ実戦モード
    color: "#D9822B"
    goal: 時間内に全科目を解き切る。目標得点率に届かせる
    todo:
      - 12/4〜 受験票をマイページから A4 で印刷・確認、顔写真付きの身分証を用意
      - 予想問題パックで、本番の時間割どおりに週1回通し演習
      - 勉強の配分は 共テ8：二次2
      - 私大（MARCH・東洋）の募集要項を読み、試験日と入学金の締切を一覧に
      - 調査書・証明写真の準備（担任の先生に依頼）
      - 12/20 東進 共テ本番レベル模試
    decide:
      - by: 2026-12-18
        q: （東洋 基礎テに受かったら）一次手続をする？
        look: [12/14 の合否, 払うお金の額と、あとで戻るか, 12月の模試の結果]
        rule: 家族で決めた予算の中なら手続して、押さえを確保
      - by: 2026-12-25
        q: 私大はどこを・何回受ける？
        look: [MARCH 比較表の試験日・手続締切・延納, 受験料と入学金の合計, 2/25 の前期試験までの日数]
        rule: 前期試験の前1週間（2/18〜）には私大の試験を入れない。延納できる大学を優先
      - by: 2026-12-25
        q: 共テの目標得点率は？
        look: [12/20 東進模試までの得点率の推移, 前期候補のボーダー]
        rule: 本命のボーダー＋3% を目標に。科目ごとの目標点もメモしておく
  - from: 2026-12-26
    to: 2027-01-15
    title: 直前期・私大の出願
    color: "#2E7D4F"
    goal: 本番と同じリズムで毎日過ごす
    todo:
      - 共テの時間割どおりに演習（9:30 開始に合わせて朝型に）
      - 私大の共テ利用・一般選抜に出願（1月中旬締切が多い）
      - 試験会場の下見、当日の持ち物をそろえる
      - 新しい問題集は増やさず、間違えた問題をやり直す
    decide:
      - by: 2027-01-15
        q: 私大の共テ利用に出す？（共テの前に締切）
        look: [12月の模試の得点率と、共テ利用のボーダー（MARCH 比較表）, 受験料]
        rule: 模試でボーダー −5% 以内の大学だけ出す。届かないところは一般選抜で
  - from: 2027-01-16
    to: 2027-01-24
    title: 共テ本番 → 出願校を決める
    color: "#C8102E"
    goal: 自己採点とリサーチから、前期・中期・後期のベストな組み合わせを決める
    todo:
      - 1/16・17 共通テスト
      - 1/18 自己採点・共テリサーチを出す
      - ボーダーとの差で、前期・中期・後期の出願校を家族・先生と決める
      - 翌日から二次対策に完全に切り替える
    decide:
      - by: 2027-01-24
        q: 前期・中期・後期の出願校は？（いちばん大事）
        look: [自己採点の得点率（科目ごと）, 共テリサーチの判定（A〜E）とボーダーとの差, 共テと二次の配点の比率（二次が重いと逆転しやすい）, 第1段階選抜（足切り）の予告倍率, 二次科目が自分の型と合うか]
        rule: ボーダーとの差が −3% 以内なら出願OK、+5% 以上なら一段上げる。二次の比率が高い大学なら −5% でも勝負できる。足切りが心配なら、予告倍率が低い大学に
      - by: 2027-01-24
        q: 私大の一般選抜を減らす？増やす？
        look: [自己採点の結果, 東洋大の共テ利用で受かりそうか]
        rule: 共テがよければ私大は減らして二次対策の時間に。悪ければ一般選抜を1〜2回足す
  - from: 2027-01-25
    to: 2027-02-24
    title: 二次対策＋私大本番
    color: "#1F4E8C"
    goal: 前期の過去問で合格最低点を超える（5年分）
    todo:
      - 国公立に出願（1/25〜2/3、締切日必着に注意）
      - 私大の一般選抜（MARCH・東洋）を受験。移動と体調に気をつける
      - 2/10 前期の第1段階選抜（足切り）の結果を確認
      - 私大の入学金をどこに払うか決める（締切が国公立の発表より前）
      - 前期の過去問を本番と同じ時間で解く
    decide:
      - by: 2027-02-03
        q: 国公立の出願を最終確認（出したら変えられない）
        look: [1/22 の得点調整の発表, 募集要項の科目・配点がもう一度合っているか]
        rule: 締切日必着の大学が多いので、2/1 までに出し終える
        source: https://www.janu.jp/cms/wp-content/uploads/2026/06/nyuushi_2027.pdf
      - by: 2027-02-24
        q: 私大の入学金をどこに払う？
        look: [私大の合否, 東洋の手続締切 2/26（前期の発表 3/6 より前）, 延納（入学金だけ払って残りは待てる）の有無, 共テリサーチの判定]
        rule: 前期の判定が C 以下なら押さえに払う。A・B でも不安なら払う。2月中に家族で決めておく
  - from: 2027-02-25
    to: 2027-03-11
    title: 前期本番 → 中期・後期へ
    color: "#1F4E8C"
    goal: 前期で決める。だめでも中期・後期で取り切る
    todo:
      - 2/25〜 前期の個別試験（前泊・交通は早めに予約）
      - 中期（3/8〜）・後期（3/12〜）の対策：過去問・面接・小論文
      - 3/6〜 前期の合格発表 → 合格なら 3/15 までに入学手続
    decide:
      - by: 2027-03-15
        q: 前期に受かったら、手続する？
        look: [前期の合否（3/6〜）, 中期・後期の大学のほうが行きたいか]
        rule: 前期で手続すると、中期・後期は受かっても入れない。迷ったら前期で決める
        source: https://www.janu.jp/cms/wp-content/uploads/2026/06/nyuushi_2027.pdf
  - from: 2027-03-12
    to: 2027-03-31
    title: 後期・手続き・新生活
    color: "#5B6170"
    goal: 進学先を決めて、新生活の準備
    todo:
      - 3/12〜 後期試験
      - 3/20〜 後期・中期の発表 → 3/27 までに手続
      - 住まい探し・入学の準備
    decide:
      - by: 2027-03-27
        q: 進学先はどこ？
        look: [後期・中期の合否（3/20〜）, 払った入学金, 住まい・通学・学費]
        rule: 後期で受かったら 3/27 までに手続。もし全部ダメでも、3/28〜 の追加合格・欠員補充を確認
        source: https://www.janu.jp/cms/wp-content/uploads/2026/06/nyuushi_2027.pdf

