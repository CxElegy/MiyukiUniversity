  # 出典：大学入試センター 令和9年度 実施要項。遅刻は開始20分後まで（2科目の地歴公民・理科は9:50までに入室）

checklist:
  - group: 共通テスト
    items:
      - 出願内容の確認・訂正（10/16 17:00まで）
      - 受験票をマイページで取得し A4 で印刷（12/4〜）
      - 顔写真付きの身分証（学生証など）を用意
      - 受験票の写真・氏名・科目を確認
      - 試験会場までの行き方・所要時間を確認（下見）
      - 持ち物：受験票・写真票・HB鉛筆・消しゴム・時計・昼食
      - 問題冊子に自分の解答をメモ（自己採点用）
      - 翌日に自己採点 → 共通テストリサーチに参加
  - group: 出願
    items:
      - 調査書の発行を担任の先生に依頼
      - 証明写真を多めに用意（出願用）
      - 各大学の募集要項を読む・Web出願のアカウント作成
      - 私大の出願締切を一覧にする（共テ利用は1月中旬締切が多い）
      - 受験料の支払い方法を確認
      - 国公立の出願（前期・後期）
  - group: 体調・生活
    items:
      - インフルエンザの予防接種
      - 朝型の生活リズムに切り替え（試験は9時台開始）
      - 遠い会場ならホテル・交通を早めに予約
      - 当日のお守り・カイロ・マスク
  - group: 合格後
    items:
      - 入学金・授業料の金額と締切を確認
      - 国公立の発表日と私大の入学金締切の順番を確認
      - 必要なら住まい探し

changes:
  - title: 共通テストの出願はWebのみ（2年目）
    body: 高3も一人ひとりが自分のマイページで出願。受験票も12/4からマイページで取得して A4 で印刷（去年より6日早い）。スマホ画面は不可、顔写真付きの身分証も必要。
    source: https://www.dnc.ac.jp/kyotsu/shiken_jouhou/r9/r9_jukenannai.html
  - title: 成績は自己採点で出願
    body: 大学への成績提供は2/2以降で、本人への事前の成績通知はない。出願時に希望した人だけ、4/1〜4/30 にマイページで成績を見られる（300円）。
    source: https://www.dnc.ac.jp/kyotsu/shiken_jouhou/r9/r9_jukenannai.html
  - title: 新課程の科目だけで実施
    body: 旧課程の経過措置科目はなし。理系は「数学①（Ⅰ・A）」「数学②（Ⅱ・B・C）」「情報Ⅰ」が2日目に集中する。
    source: https://www.dnc.ac.jp/albums/abm.php?d=753&f=abm00017382.pdf
  - title: 共テ出願者は 490,725人（前年同時点より547人減）
    body: 現役 410,405人（−6,560）、既卒 80,320人（+6,013）。確定志願者数は12月上旬に発表予定。
    source: https://resemom.jp/article/2026/10/07/87799.html
  - title: 推薦・総合型で面接が必須に（文科省 実施要項）
    body: 年内入試が学力試験だけに偏らないよう、総合型・学校推薦型では面接による評価が必要に。言語能力・数理的思考力の評価にも配慮。
    source: https://www.mext.go.jp/content/20260526-mxt_daigakuc02-100001251_1.pdf
  - title: 英検 第3回は共テ追試と同じ日
    body: 一次 1/24（日）、結果は 2/15。一般選抜の出願には間に合わないことが多いので、使うなら S-CBT（12月〜）も検討。
    source: https://www.eiken.or.jp/eiken/schedule/examinee/03/

