flow:
  - title: ① 国公立（第一志望）
    color: "#1F4E8C"
    lead: 共テの点＋二次試験で決まる。共テのあとに出願先を決めるのがポイント。前期・中期・後期で1校ずつ出せる。
    steps:
      - {when: "1/16・17", what: 共通テストを受ける}
      - {when: "1/18", what: 自己採点 → 予備校のリサーチに出す, detail: 河合塾・駿台ベネッセなどに自己採点を送ると、志望校の判定が返ってくる}
      - {when: "〜1/24", what: 出願先を決める（前期・中期・後期）, detail: リサーチの判定とボーダーを見て、家族・先生と相談}
      - {when: "1/25〜2/3", what: 大学のサイトでWeb出願, detail: "入力 → 検定料 17,000円を払う → 共テの受験番号を入力（成績は大学がセンターから取り寄せる）→ 調査書などを郵送。締切日必着の大学が多い"}
      - {when: "〜2/10", what: 前期の第1段階選抜（足切り）の結果, detail: 二段階選抜をする大学だけ}
      - {when: "2月中旬", what: 受験票をWebで印刷}
      - {when: "2/25〜", what: 前期の個別試験 → 3/6〜10 合格発表}
      - {when: "3/15まで", what: 前期で合格したら入学手続, detail: 手続きすると中期・後期は受けても合格にならない}
      - {when: "3/12〜", what: 後期（中期は3/8〜）→ 3/20〜24 発表 → 3/27 手続}
  - title: ② 私大の一般選抜（MARCH・東洋）
    color: "#2E7D4F"
    lead: 大学ごとの試験の点で決まる。出願は共テ前後の1月。大学ごとに締切がバラバラなので一覧にしておく。
    steps:
      - {when: "11月〜12月", what: 募集要項を読む・Web出願のアカウントを作る, detail: 正式な要項は11月上旬から公開}
      - {when: "1月上旬〜下旬", what: 大学のサイトでWeb出願, detail: "検定料は1回 約35,000円（同じ大学で複数出すと割引あり）。調査書を郵送（消印有効の大学が多い）"}
      - {when: "試験の1〜2週間前", what: 受験票をWebで印刷}
      - {when: "2/1〜2/15ごろ", what: 試験 → 2月中旬〜下旬に合格発表}
      - {when: "2月下旬", what: 入学手続（1次）＝入学金を払う, detail: 延納できる大学（明治・青学・中央）は、残りの学費を国公立の発表のあとまで待てる}
  - title: ③ 私大の共テ利用
    color: "#C8102E"
    lead: 共テの点だけで決まる（大学の試験を受けに行かなくていい）。締切が共テより前なのに注意。
    steps:
      - {when: "1/15まで", what: Web出願（MARCHはどこも1/15締切）, detail: "共テの受験番号を入力。検定料は 約15,000〜18,000円"}
      - {when: "1/16・17", what: 共通テストを受ける（これが試験）}
      - {when: "2月中旬", what: 合格発表（例：法政 2/9、中央 2/13、明治 2/15）}
      - {when: "2月中旬〜下旬", what: 入学手続（1次）, detail: 一般選抜と同じく、延納できるかを確認}
  - title: ④ 合格したら（入学手続）
    color: "#5B6170"
    lead: 私大の締切は国公立の発表より前に来る。お金の流れを先に家族で決めておく。
    steps:
      - {when: "私大の1次締切", what: 押さえの1校に入学金を払う（約20〜24万円）, detail: 入学金は辞退しても戻らない}
      - {when: "延納の締切（3月中旬〜下旬）", what: 国公立の結果を見てから残りの学費を払う／払わない}
      - {when: "3/6〜", what: 国公立に合格 → 3/15までに手続 → 私大は辞退の手続}
      - {when: "3/31まで", what: 私大を辞退すれば、入学金以外（授業料など）は返ってくる}

flow_common:
  - 調査書：担任の先生に発行を頼む。出す大学の数＋予備（封をした状態で使う）
  - 証明写真：たて4×よこ3cm、3か月以内に撮ったもの。Web出願用にデータも
  - 共テの受験番号（マイページで確認できる）、メールアドレス、検定料の払い方（クレジット・コンビニ）
  - 郵送：大学のサイトから宛名ラベルを印刷し、角2封筒で「簡易書留・速達」が基本
  - 検定料の目安：国公立 17,000円/校、私大一般 約35,000円/回、共テ利用 約15,000〜18,000円/回

