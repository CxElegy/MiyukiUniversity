topics:
  - name: 共通テスト
    queries: ["共通テスト 2027", "大学入試センター"]
    match: [共通テスト, 大学入試センター, 共テ]
    urgent: ["出願者数|志願者数|平均点|中間集計|正解|追試|受験票|訂正|再試験|時間割|延期|問題訂正"]
  - name: 国公立大学
    queries: ["国公立大学 二次試験", "国立大学 入試 2027", "国公立 出願 2027", "地方国立大学 理系"]
    match: [国公立, 国立大, 公立大, 二次試験, 個別学力, 前期日程, 後期日程]
    urgent: ["志願状況|日程変更|出願締切"]
  - name: 私立大学
    queries: ["私立大学 一般選抜 2027", "共通テスト利用入試", "私大 入試 理工"]
    match: [私立, 私大, 一般選抜, 共テ利用, 共通テスト利用, 一般入試]
  - name: 推薦・総合型
    queries: ["総合型選抜", "学校推薦型選抜", "指定校推薦"]
    match: [総合型, 推薦]
  - name: 入試制度・変更
    queries: ["大学入試 変更 予告", "2028年度入試 変更", "学部 新設 2027 国立大学"]
    match: [入試, 選抜, 新設]
  - name: 英検・外部試験
    queries: ["英検 大学入試", "英検 2026年度 第3回"]
    match: [英検, TEAP, GTEC, IELTS, TOEFL]

